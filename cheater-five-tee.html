<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRODUCT | CHEATER FIVE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark">
    <div class="noise"></div>

    <!-- Nav -->
    <nav class="nav-brutal">
        <a href="index.html" class="nav-home">HOME</a>
        <div class="nav-links-brutal">
            <a href="shop.html">SHOP</a>
            <a href="about.html">INFO</a>
        </div>
    </nav>

    <!-- Product Detail -->
    <section class="product-detail-brutal">
        <div class="product-image-brutal">
            <div class="product-placeholder-large">
                <img src="images/surfer girl.png" alt="CHEATER FIVE">
            </div>
        </div>

        <div class="product-info-brutal">
            <h1>CHEATER FIVE</h1>
            <p class="price-brutal-large">$30</p>

            <div class="status-banner">
                PRODUCTS — COMING SOON
            </div>

            <div class="product-description-brutal">
                <p>Heavyweight cotton tee. Cheater Five graphic.</p>
            </div>

            <div class="size-selector-brutal">
                <label>SIZE</label>
                <div class="size-buttons">
                    <button class="size-btn-brutal">S</button>
                    <button class="size-btn-brutal active">M</button>
                    <button class="size-btn-brutal">L</button>
                    <button class="size-btn-brutal">XL</button>
                </div>
            </div>

            <button class="cta-brutal">NOTIFY WHEN AVAILABLE</button>

            <div class="product-details-list">
                <h3>DETAILS</h3>
                <ul>
                    <li>Heavyweight cotton</li>
                    <li>Screen printed graphics</li>
                    <li>Made to order</li>
                    <li>Limited run</li>
                    <li>Designed in California</li>
                </ul>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer-brutal">
        <div class="footer-brutal-content">
            <p>BETWEEN NOISE AND KNOWING</p>
            <div class="footer-links-brutal">
                <a href="https://www.instagram.com/slightly_lowked__/" target="_blank" rel="noopener noreferrer">INSTAGRAM</a>
                <a href="#">CONTACT</a>
            </div>
        </div>
    </footer>

    <script>
        const sizeBtns = document.querySelectorAll('.size-btn-brutal');
        sizeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                sizeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });
    </script>
</body>
</html>
